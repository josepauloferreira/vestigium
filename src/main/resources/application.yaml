spring:
  application:
    name: vestigium
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/vestigium}
    username: ${DB_USERNAME:vestigium}
    password: ${DB_PASSWORD:vestigium-local}
  sql:
    init:
      mode: never

server:
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
